[package]
name = "dispatch-auth"
version = "0.1.0"
edition = "2021"
description = "The dispatch plane's single auth engine: Biscuit + PoP verification (PEP/PDP) and the credential signer."
license = "MIT"

[lib]
name = "dispatch_auth"
path = "src/lib.rs"

[[bin]]
name = "pep"
path = "src/bin/pep.rs"

[[bin]]
name = "signer"
path = "src/bin/signer.rs"

[dependencies]
biscuit-auth = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
# RFC 9449 DPoP proof (JWT) verification for the HTTP surface — a maintained JOSE
# parser/verifier so the browser-facing proof is library-produced/consumed, not a
# hand-rolled canonical held equal across three languages by cross-impl tests.
# `rust_crypto` is REQUIRED, not just an umbrella: jsonwebtoken 10.x installs its
# CryptoProvider only when `rust_crypto` (pure Rust) or `aws_lc_rs` (a C toolchain we
# reject — it breaks the pure-Rust build + local dev) is enabled; the per-algorithm
# sub-features alone leave NO provider and panic at verify. `rust_crypto` unavoidably
# links `rsa` (RUSTSEC-2023-0071, unfixed upstream) — but it is UNREACHABLE: verification
# is pinned to `Algorithm::EdDSA` + OKP-only keys (dpop.rs), so no RSA op is ever invoked,
# and the alg-confusion rejection test is the guard that keeps it so. The runner surfaces
# (cas/v0, dispatch/v0) keep the bespoke PoP.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
rand = "0.10"
redb = "2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
