# Smokescreen config. Model compute reaches allowlisted hosts through this proxy.
# Unknown roles and special-purpose address ranges are denied.
---
# listen-ip / listen-port / egress-acl-file are passed as CLI flags in the deploy
# compose command (this smokescreen version rejects them as config-file keys).
# Smokescreen blocks RFC1918 and loopback natively; these add other special ranges.
deny_ranges:
  - 169.254.0.0/16
  - 100.64.0.0/10
  - 127.0.0.0/8
  - ::1/128
  - fe80::/10
