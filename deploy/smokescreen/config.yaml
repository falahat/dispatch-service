# Smokescreen (EgressGuard) config. When the ingest lane lands, its compute reaches the
# internet ONLY through this proxy, identified by an mTLS client cert (CN = role) and
# held to its role's allowlist. Deny is the default; roleless clients are hard-denied.
# NOT deployed until then — a resident proxy with no guarded lane is only an extra
# reachable neighbor.
---
# listen-ip / listen-port / egress-acl-file are passed as CLI flags in the deploy
# compose command (this smokescreen version rejects them as config-file keys).
# Deny access to link-local / private ranges by default (SSRF hardening,
# including the CGNAT range). smokescreen blocks RFC1918 + loopback natively;
# these add the remaining special ranges.
deny_ranges:
  - 169.254.0.0/16
  - 100.64.0.0/10
  - 127.0.0.0/8
  - ::1/128
  - fe80::/10
