[package]
name = "dispatch-auth"
version = "0.1.0"
edition = "2021"
description = "The dispatch plane's single auth engine: Biscuit + PoP verification (PEP/PDP) and the credential signer."
license = "MIT"

[lib]
name = "dispatch_auth"
path = "src/lib.rs"

[[bin]]
name = "pep"
path = "src/bin/pep.rs"

[[bin]]
name = "signer"
path = "src/bin/signer.rs"

[dependencies]
# Without `datalog-macro`: its proc-macro crate (biscuit-quote) pulls the unmaintained
# proc-macro-error. cred.rs builds facts from typed terms and parses its Datalog text at
# runtime instead.
biscuit-auth = { version = "5", default-features = false, features = ["regex-full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
# RFC 9449 DPoP proof (JWT) verification for the HTTP surface — a maintained JOSE
# parser/verifier so the browser-facing proof is library-produced/consumed, not a
# hand-rolled canonical held equal across three languages by cross-impl tests.
# `rust_crypto` is the pure-Rust CryptoProvider; without a provider jsonwebtoken panics at
# verify, and the other one, `aws_lc_rs`, needs a C toolchain (it breaks the pure-Rust
# build + local dev). The provider also links RSA, ECDSA and HMAC, which never run:
# verification is pinned to `Algorithm::EdDSA` + OKP-only keys (dpop.rs), and the
# alg-confusion rejection tests keep it so. The runner surfaces (cas/v0, dispatch/v0)
# keep the bespoke PoP.
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
rand = "0.8"
redb = "2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
# TCP keepalive timing on accepted connections (shutdown.rs). tokio already builds it with
# `all`, which the probe count needs.
socket2 = { version = "0.6", features = ["all"] }
bytes = "1"
log = "0.4"
# Without `humantime`: its jiff dependency drags defmt and the unmaintained
# proc-macro-error2 into Cargo.lock. The container log driver stamps every line anyway.
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "regex"] }

[dev-dependencies]
tempfile = "3"
