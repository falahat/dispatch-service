# Egress allowlist for the INGEST lane (feed/download compute) — the one lane whose
# nature requires egress. NOT deployed yet: no plane lane egresses today (the GPU lane
# runs from a pre-warmed offline model cache; ingest still lives in the coordinator).
# This kit returns to the deploy compose when the ingest lane lands.
#
# Identity model: this smokescreen build hard-denies clients it cannot role — and the
# only role source is a TLS client certificate (CN = role). That roleless hard-deny is
# the fail-closed default we WANT: an unidentified container gets nothing. Wiring a lane
# means issuing it a client cert and giving its role a `services:` stanza here, so every
# lane carries its OWN allowlist (per-identity, least-privilege) instead of sharing a
# flat global one.
---
version: v1

# Per-role stanzas (CN -> policy) are added as lanes are wired for egress, e.g.:
#   - name: ingest
#     project: easypod
#     action: enforce
#     allowed_domains: [feeds.libsyn.com, ...]
services: []

# Anything without a matching role stanza: enforce against an EMPTY allow set = deny.
default:
  name: default
  project: easypod
  action: enforce
  allowed_domains: []

# Feed / CDN hosts the ingest lane will need (moved into its role stanza when wired).
global_allow_list:
  - "feeds.libsyn.com"
  - "traffic.libsyn.com"
  - "*.megaphone.fm"
  - "*.simplecast.com"
  - "*.acast.com"
  - "feeds.buzzsprout.com"
