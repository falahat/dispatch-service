# Source-network roles have separate policies. `model` is an exact host allowlist for
# compute downloads. `ingest` accepts arbitrary public podcast hosts; config.yaml still
# rejects private, local, metadata, link-local, and CGNAT addresses on every connection.
---
version: v1

services:
  - name: model
    project: easypod
    action: enforce
    allowed_domains:
      - "huggingface.co"
      - "cdn-lfs.huggingface.co"
      - "cdn-lfs-us-1.huggingface.co"
      - "us.aws.cdn.hf.co"
      - "cas-bridge.xethub.hf.co"
      - "cas-server.xethub.hf.co"
      - "transfer.xethub.hf.co"
      - "download.pytorch.org"
      - "raw.githubusercontent.com"

  - name: ingest
    project: easypod
    action: open

# Anything not carrying a known role: enforce against an empty allow set = deny.
default:
  name: default
  project: easypod
  action: enforce
  allowed_domains: []
