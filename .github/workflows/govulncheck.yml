# Go vulnerability scanning with REACHABILITY analysis — govulncheck reports only advisories
# whose vulnerable symbols are actually called by our code, a stricter signal than a lockfile
# match. Covers both Go modules: the dispatcher/runner (root) and the smokescreen egress guard.
# This promotes the previously-manual smokescreen govulncheck (the "bump -> govulncheck ->
# rebuild" policy in CLAUDE.md) to an automatic, fail-closed gate on every push/PR + weekly.
name: govulncheck
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 12 * * 1"
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "deploy/smokescreen"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      # govulncheck is the scanner, not a shipped dependency — always run the current
      # release so the vuln database + reachability logic are up to date.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...
