# cargo-deny policy for the dispatch plane's auth crate — the single Biscuit + PoP + DPoP
# verifier and credential signer. Enforced by .github/workflows/cargo-deny.yml on every push/PR
# (and locally via `cargo deny check`). Four fail-closed gates:
#   advisories — any RustSec advisory (vuln/yanked) in the LOCKED graph fails the build.
#   bans       — wildcard version requirements are a supply-chain hole; duplicates are surfaced.
#   licenses   — an EXACT permissive allowlist; an unlisted/unknown license fails.
#   sources    — crates may come ONLY from crates.io; no arbitrary git/other registry.

[advisories]
version = 2
yanked = "deny"
# One documented exception: an unmaintained-status notice (not a vulnerability) for a
# compile-time-only crate. Every vulnerability advisory fails the gate.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a COMPILE-TIME-only proc-macro helper of biscuit-quote 0.2 (biscuit-auth 5's macro crate) — it is not linked into the shipped PEP/signer binary. This is an unmaintained-status advisory (not a vulnerability) with no safe upgrade: biscuit-auth 6's biscuit-quote 0.3 moved to proc-macro-error2, which is unmaintained too (RUSTSEC-2026-0173), and only the 7.x line (alpha) drops both." },
]

[bans]
multiple-versions = "warn" # duplicate transitive versions: surface, don't hard-fail
wildcards = "deny"         # a `*` version requirement is an open supply-chain door

[licenses]
version = 2
# The EXACT license set present in the locked tree (from `cargo deny list`) — all permissive.
# A newly introduced license fails the gate so it is adopted consciously, never by drift.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
