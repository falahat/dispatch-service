# Dispatcher config for the containerized plane. Change = restart.
db_path = "/data/dispatch.db"
runner_listen = "0.0.0.0:7700"   # backplane only; the PEP fronts this
app_socket = "/run/dispatch/app.sock"
heartbeat_interval_s = 15
lease_ttl_s = 300
min_wait_s = 0
max_wait_s = 60
runner_rate_per_min = 240
sweep_interval_s = 5

# Retention for this dispatcher's OWN queue bookkeeping only. Prunes terminal jobs
# (SUCCEEDED/FAILED/REJECTED/CANCELLED) + their attempts older than N days.
#   0 = NO TTL — keep forever (the default; this queue is re-derivable, never a
#       source of record). Domain data (transcripts, analysis results) lives in the
#       app's own store and is NEVER touched by this.
# Set > 0 (e.g. 90) to bound this DB's growth; recent history is always kept for the
# dead-letter / debugging views. (Code default is 0/forever; this deployment opts into 90d.)
job_retention_days = 90

[default_lane]
concurrency = 0
persisting_watermark = 64

[lanes.transcribe]
concurrency = 1        # one GPU job at a time
persisting_watermark = 8

[lanes.embed]
concurrency = 4
persisting_watermark = 64

[lanes.feed]
concurrency = 2
persisting_watermark = 32

[lanes.download]
concurrency = 2
persisting_watermark = 32

[budget]
cap_usd = "0.00"       # fail-closed: no priced (cloud) job runs until raised
