# Egress allowlist for ingest-lane compute (feed/download). Default deny;
# add the podcast feed + media hosts your corpus actually fetches. Enforced
# in "enforce" mode — a request to any other host is refused.
---
version: v1
default:
  name: default
  action: enforce
  allowed_domains:
    # Model pulls (GPU compute preload): whisperx/pyannote fetch from the HF
    # hub into the persistent cache volume on a cache miss — through the guard,
    # never raw egress. Steady state hits the cache and makes no request.
    - "huggingface.co"
    - "*.huggingface.co"
    - "*.hf.co"
    # Feed/CDN hosts for the ingest lane (feed/download compute).
    - "*.libsyn.com"
    - "*.megaphone.fm"
    - "*.simplecast.com"
    - "*.acast.com"
    - "feeds.buzzsprout.com"
