# cargo-deny policy for the dispatch plane's auth crate — the single Biscuit + PoP + DPoP
# verifier and credential signer. Enforced by .github/workflows/cargo-deny.yml on every push/PR
# (and locally via `cargo deny check`). Four fail-closed gates:
#   advisories — any RustSec advisory (vuln/yanked) in the LOCKED graph fails the build.
#   bans       — wildcard version requirements are a supply-chain hole; duplicates are surfaced.
#   licenses   — an EXACT permissive allowlist; an unlisted/unknown license fails.
#   sources    — crates may come ONLY from crates.io; no arbitrary git/other registry.

[advisories]
version = 2
yanked = "deny"
# One documented exception, justified by UNREACHABILITY — and kept only because every
# elimination path is verified WORSE. RUSTSEC-2023-0071 (the "Marvin" constant-time failure in
# the `rsa` crate) has NO upstream fix. `rsa` is linked transitively by jsonwebtoken 10.4.0 (the
# LATEST release): its CryptoProvider installs only when the `rust_crypto` (pure-Rust) or
# `aws_lc_rs` feature is on — the per-algorithm sub-features alone leave no provider and PANIC at
# verify (tested) — and `rust_crypto` unavoidably pulls rsa/p256/p384/hmac. The alternatives were
# tried and rejected: `aws_lc_rs` needs a C toolchain (breaks the pure-Rust build + local dev);
# hand-rolling the JWS verify / a custom provider replaces an audited verifier with bespoke
# security-critical crypto — trading a proven-unreachable, unfixed advisory for the risk of a
# REACHABLE hand-rolled bug, the wrong trade for the PEP. rsa is never invoked: verification is
# pinned to `Algorithm::EdDSA` + OKP-only keys (dpop.rs), guarded by the alg-confusion tests
# (`alg_confusion_rs256_is_401` / `_hs256` / `alg_none_proof_is_401` in tests/http_proxy.rs) —
# admitting RS256 would make rsa reachable AND fail those tests. Revisit if jsonwebtoken ever
# ships a provider without rsa. REACHABLE advisories are never ignored.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa is linked via jsonwebtoken's required rust_crypto provider (no rsa-free provider exists on the latest release); the PEP is EdDSA-only + alg-confusion-guarded, so the RSA path is unreachable dead code. No upstream fix exists; every elimination path is worse (see comment)." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a COMPILE-TIME-only proc-macro helper of biscuit-quote (biscuit-auth 5's macro crate) — it is not linked into the shipped PEP/signer binary. This is an unmaintained-status advisory (not a vulnerability), transitive via our audited biscuit-auth, with no safe upgrade. Drops out when biscuit-auth moves biscuit-quote off it." },
]

[bans]
multiple-versions = "warn" # duplicate transitive versions: surface, don't hard-fail
wildcards = "deny"         # a `*` version requirement is an open supply-chain door

[licenses]
version = 2
# The EXACT license set present in the locked tree (from `cargo deny list`) — all permissive.
# A newly introduced license fails the gate so it is adopted consciously, never by drift.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
