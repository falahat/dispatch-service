# Standalone local integration stack. Consuming applications own production Compose.
# The bundled echo compute needs no internet route or egress guard.

networks:
  backplane:
    internal: true
  edge: {}
  invoke:
    internal: true

volumes:
  cas-data: {}
  dispatch-db: {}
  app-sock: {}
  pep-nonces: {}
  work: {}

services:
  # Content-addressable byte store (adopted). Only the PEP may reach it.
  cas:
    image: buchgr/bazel-remote-cache@sha256:70d9faa54f53e7673ce96dbefae3c8c0c47f343c210ecc948d088604dbebe0d4
    command: ["--dir=/data", "--max_size=64", "--http_address=0.0.0.0:8080"]
    networks: [backplane]
    volumes:
      - cas-data:/data
    restart: unless-stopped

  # The durable work service. Runner surface is reached only via the PEP; the
  # app surface is a UDS on a shared volume.
  dispatcher:
    build:
      context: .
      dockerfile: dispatcher/Dockerfile
    networks: [backplane]
    volumes:
      - dispatch-db:/data
      - app-sock:/run/dispatch
      - ./deploy/plane.toml:/etc/dispatch/plane.toml:ro
    restart: unless-stopped

  # The single verify engine. Fronts BOTH tailnet surfaces; holds only the root
  # public key. The two exposed ports are the plane's only external doors.
  pep:
    build:
      context: ./auth
      dockerfile: Dockerfile
    depends_on: [dispatcher, cas]
    networks: [backplane, edge]
    env_file: .env # PEP_ROOT_PUBKEY, written by bootstrap
    environment:
      PEP_DISPATCHER_ADDR: dispatcher:7700
      PEP_CAS_BACKEND: http://cas:8080
      PEP_CAS_STYLE: bazel
      PEP_RUNNER_LISTEN: 0.0.0.0:7443
      PEP_CAS_LISTEN: 0.0.0.0:8443
      PEP_NONCE_DB: /data/nonces.redb
      RUST_LOG: info
    volumes:
      - pep-nonces:/data
    ports:
      - "7443:7443" # runner surface (tailnet)
      - "8443:8443" # cas surface (tailnet)
    restart: unless-stopped

  # A worker: the runner drives its paired compute over the invoke protocol on
  # the private invoke network; both share the /work volume. This example runs
  # the echo compute on the `embed` lane.
  runner-embed:
    build:
      context: .
      dockerfile: runner/Dockerfile
    depends_on: [pep, echo]
    networks: [edge, invoke]
    environment:
      DISPATCHER_ADDR: pep:7443
      CAS_URL: http://pep:8443
      INVOKE_ADDR: echo:8080
      WORK_ROOT: /work
      LANES: embed
      CREDENTIAL: /run/cred/cred.json
    volumes:
      - work:/work
      - ./deploy/cred:/run/cred:ro
    restart: unless-stopped

  # The compute container has no credential or internet route.
  echo:
    build:
      context: ./compute/echo
    networks: [invoke]
    environment:
      INVOKE_ADDR: 0.0.0.0:8080
    volumes:
      - work:/work
    restart: unless-stopped
