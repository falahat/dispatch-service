# Egress allowlist for the plane's worker lane. Every worker-net client gets the static
# "worker" role (main.go — the internal network's membership is the identity: only a
# runner and its compute pair live there), and that role reaches EXACTLY the known
# model hosts below; everything else is denied. Models pull themselves on first use
# into the cache volume (a speed/convenience cache, not a maintained artifact).
#
# The host set is EMPIRICAL — observed from a full production-policy pipeline run
# (transcribe + align + diarize + embed), not guessed:
#   huggingface.co + cdn-lfs*/xet     hub API, LFS + xet-backed weight downloads
#   download.pytorch.org              torchaudio alignment pipelines (wav2vec2)
#   raw.githubusercontent.com         nltk tokenizer data (pulled at first use)
# A lane with different egress needs gets its OWN role (mTLS client-cert CN) and its
# own stanza — never a widening of this one.
---
version: v1

services:
  - name: worker
    project: easypod
    action: enforce
    allowed_domains:
      - "huggingface.co"
      - "cdn-lfs.huggingface.co"
      - "cdn-lfs-us-1.huggingface.co"
      - "cas-bridge.xethub.hf.co"
      - "transfer.xethub.hf.co"
      - "download.pytorch.org"
      - "raw.githubusercontent.com"

# Anything not carrying a known role: enforce against an empty allow set = deny.
default:
  name: default
  project: easypod
  action: enforce
  allowed_domains: []
